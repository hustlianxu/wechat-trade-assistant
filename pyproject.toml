[project]
name = "wechat-trade-assistant"
version = "0.1.0"
description = "南美外贸微信智能助手 - 本地优先的微信聊天记录解析、西班牙语转录、意图识别、待办管理与自然语言查询"
authors = [{ name = "WeChat Trade Assistant" }]
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # Web 服务
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",

    # 本地数据库
    "sqlalchemy>=2.0.25",
    # SQLCipher 绑定（解密微信 4.0 数据库需要 pysqlcipher3，安装较复杂，
    # 沙箱/开发环境可先回退到标准 sqlite3，运行时由 decrypt 模块按可用性自动选择）
    # "pysqlcipher3>=1.2.0",

    # NLP / 解析
    "regex>=2024.0.0",
    "python-dateutil>=2.8.2",

    # HTTP 客户端（用于调用云端 LLM API）
    "httpx>=0.27.0",

    # 本地 STT / 意图模型（按需启用，沙箱中默认走兜底实现）
    # "transformers>=4.38.0",
    # "torch>=2.1.0",
    # "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]
